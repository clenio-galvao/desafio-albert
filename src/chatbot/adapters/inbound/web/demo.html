<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chatbot RAG — Saúde Mental</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f7f5;
      --surface: #ffffff;
      --text: #183029;
      --muted: #5e716a;
      --accent: #176b57;
      --accent-text: #ffffff;
      --border: #ced9d5;
      --user: #dceee8;
      --assistant: #f1f3f2;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101715;
        --surface: #18211e;
        --text: #e8efec;
        --muted: #a8b8b2;
        --accent: #59b99e;
        --accent-text: #0b211a;
        --border: #34443e;
        --user: #21483d;
        --assistant: #222d29;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }
    main {
      width: min(860px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 28px 20px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 { margin: 0; font-size: 1.35rem; }
    header p { margin: 5px 0 0; color: var(--muted); font-size: .9rem; }
    .controls { display: flex; gap: 8px; align-items: center; }
    select, button, textarea {
      font: inherit;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    select, button { padding: 8px 10px; background: var(--surface); }
    button { cursor: pointer; }
    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 650;
    }
    button:disabled { cursor: wait; opacity: .65; }
    #messages {
      overflow-y: auto;
      padding: 4px 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 360px;
    }
    .message {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 10px;
      white-space: pre-wrap;
      line-height: 1.5;
    }
    .user { align-self: flex-end; background: var(--user); }
    .assistant { align-self: flex-start; background: var(--assistant); }
    .error { color: #b73939; border: 1px solid currentColor; }
    .sources {
      margin-top: 9px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: .82rem;
    }
    form {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
    }
    textarea {
      resize: none;
      min-height: 48px;
      max-height: 160px;
      padding: 10px;
      background: transparent;
      border: 0;
      outline: 0;
    }
    .status { color: var(--muted); font-size: .8rem; min-height: 1.2em; }
    @media (max-width: 620px) {
      main { padding: 18px 12px; }
      header { align-items: stretch; flex-direction: column; }
      .controls { justify-content: space-between; }
      .message { max-width: 94%; }
      form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Chatbot de saúde mental</h1>
        <p>Respostas fundamentadas nas apostilas, com indicação das fontes.</p>
      </div>
      <div class="controls">
        <label for="model">Modelo</label>
        <select id="model" aria-label="Modelo de linguagem"></select>
        <button id="new-session" type="button">Nova conversa</button>
      </div>
    </header>

    <section id="messages" aria-live="polite" aria-label="Conversa"></section>

    <div>
      <form id="chat-form">
        <textarea
          id="message"
          aria-label="Sua pergunta"
          placeholder="Faça uma pergunta sobre as apostilas..."
          required
          maxlength="4000"
        ></textarea>
        <button class="primary" id="send" type="submit">Enviar</button>
      </form>
      <div class="status" id="status" role="status"></div>
    </div>
  </main>

  <script>
    const model = document.querySelector("#model");
    const messages = document.querySelector("#messages");
    const form = document.querySelector("#chat-form");
    const input = document.querySelector("#message");
    const send = document.querySelector("#send");
    const status = document.querySelector("#status");
    const newSession = document.querySelector("#new-session");
    let sessionId = crypto.randomUUID();

    function addMessage(kind, text = "") {
      const element = document.createElement("article");
      element.className = `message ${kind}`;
      const content = document.createElement("div");
      content.textContent = text;
      element.append(content);
      messages.append(element);
      messages.scrollTop = messages.scrollHeight;
      return { element, content };
    }

    function showSources(target, citations) {
      if (!citations?.length) return;
      const sources = document.createElement("div");
      sources.className = "sources";
      const unique = [...new Map(
        citations.map(item => [`${item.source}:${item.page}`, item])
      ).values()];
      sources.textContent = "Fontes: " + unique
        .map(item => `${item.source}, p. ${item.page}`)
        .join(" · ");
      target.append(sources);
    }

    function parseEvent(block) {
      let event = "message";
      let data = "{}";
      for (const line of block.split("\n")) {
        if (line.startsWith("event:")) event = line.slice(6).trim();
        if (line.startsWith("data:")) data = line.slice(5).trim();
      }
      return { event, data: JSON.parse(data) };
    }

    async function loadModels() {
      const response = await fetch("/v1/models");
      if (!response.ok) throw new Error("Não foi possível carregar os modelos.");
      const payload = await response.json();
      for (const name of payload.models) {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        model.append(option);
      }
    }

    async function submitQuestion(question) {
      addMessage("user", question);
      const answer = addMessage("assistant");
      let citations = [];
      const response = await fetch("/v1/chat/stream", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: sessionId, message: question, model: model.value })
      });
      if (!response.ok || !response.body) {
        const payload = await response.json().catch(() => ({}));
        throw new Error(payload.detail || "Falha ao iniciar a resposta.");
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        let boundary;
        while ((boundary = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          if (!block.trim()) continue;
          const item = parseEvent(block);
          if (item.event === "metadata") citations = item.data.citations || [];
          if (item.event === "token") {
            answer.content.textContent += item.data.content || "";
            messages.scrollTop = messages.scrollHeight;
          }
          if (item.event === "error") throw new Error(item.data.message);
        }
        if (done) break;
      }
      showSources(answer.element, citations);
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const question = input.value.trim();
      if (!question || !model.value) return;
      input.value = "";
      send.disabled = true;
      status.textContent = "Gerando resposta...";
      try {
        await submitQuestion(question);
        status.textContent = "";
      } catch (error) {
        addMessage("assistant error", error.message);
        status.textContent = "A resposta não pôde ser concluída.";
      } finally {
        send.disabled = false;
        input.focus();
      }
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    newSession.addEventListener("click", async () => {
      await fetch(`/v1/sessions/${encodeURIComponent(sessionId)}`, { method: "DELETE" });
      sessionId = crypto.randomUUID();
      messages.replaceChildren();
      status.textContent = "Nova conversa iniciada.";
      input.focus();
    });

    loadModels().catch(error => {
      status.textContent = error.message;
      send.disabled = true;
    });
  </script>
</body>
</html>
