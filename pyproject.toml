[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "desafio-albert-chatbot"
version = "0.1.0"
description = "API de chatbot com RAG, FastAPI e arquitetura hexagonal"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Clenio" }]
dependencies = [
    "fastapi>=0.115,<1",
    "gdown>=5.2,<6",
    "httpx>=0.28,<1",
    "openai>=1.60,<3",
    "pydantic-settings>=2.7,<3",
    "pypdf>=5.1,<7",
    "qdrant-client>=1.13,<2",
    "tiktoken>=0.8,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "respx>=0.22,<1",
    "ruff>=0.9,<1",
]

[project.scripts]
chatbot-api = "chatbot.main:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
chatbot = ["adapters/inbound/web/*.html"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --cov=chatbot --cov-branch --cov-report=term-missing --cov-fail-under=90"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["chatbot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["chatbot"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]
warn_unreachable = true
pretty = true
